<!DOCTYPE html>
<html lang="no">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Takk for bestillingen!</title>
        <link rel="stylesheet" href="/css/components/return.css">
        <link rel="icon" type="image/png" href="/leaf_logo.svg"/>
        
        <script src="/js/return.js?v=5" defer></script>
    </head>
    
    <body class="page-body">
        <section id="success" class="success-section hidden">
            <div class="success-card">
                <div class="success-card-body">
                  <h1 class="success-title">Takk for bestillingen!</h1>
                  <p class="success-message">
                    Vi setter pris på at du handler hos oss! En bekreftelse blir sendt til
                    <span id="customer-email" class="customer-email"></span>.
                  </p>
                  <p class="success-contact">
                    Har du spørsmål? Send oss gjerne en e-post på
                    <a href="mailto:orders@example.com" class="contact-link">
                      orders@example.com
                    </a>.
                  </p>
                  <button id="returnBtn" onclick="returnHome()" class="return-btn">Tilbake til forsiden</button>
                </div>
            </div>
        </section>
    </body>
</html>
